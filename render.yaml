services:
  # ── ChromaDB Vector Database ──────────────────────────────────────────────
  - type: web
    name: nexus-rag-chroma
    runtime: docker
    image:
      url: docker.io/chromadb/chroma:0.5.20
    envVars:
      - key: ANONYMIZED_TELEMETRY
        value: "false"
      - key: IS_PERSISTENT
        value: "true"

  # ── Node.js Backend ───────────────────────────────────────────────────────
  - type: web
    name: nexus-rag-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CHROMA_URL
        value: "http://nexus-rag-chroma:8000"
      - key: CHROMA_COLLECTION
        value: research_papers
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: EMBEDDING_MODEL
        value: Xenova/all-MiniLM-L6-v2
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "200"
      - key: TOP_K
        value: "5"
      - key: RERANK_TOP_K
        value: "3"
      - key: MAX_FILE_SIZE_MB
        value: "50"
