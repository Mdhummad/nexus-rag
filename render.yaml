services:
  # ── Node.js Backend (Qdrant Cloud for vectors — no Docker needed!) ────────────
  - type: web
    name: nexus-rag-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false       # Set this in Render dashboard
      - key: CORS_ORIGIN
        sync: false       # Set to your Vercel URL e.g. https://nexus-rag-alpha.vercel.app
      - key: QDRANT_URL
        sync: false       # Set to your Qdrant Cloud URL e.g. https://xxx.aws.cloud.qdrant.io
      - key: QDRANT_API_KEY
        sync: false       # Set to your Qdrant Cloud API key
      - key: QDRANT_COLLECTION
        value: research_papers
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: EMBEDDING_MODEL
        value: Xenova/all-MiniLM-L6-v2
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "200"
      - key: TOP_K
        value: "5"
      - key: RERANK_TOP_K
        value: "3"
      - key: MAX_FILE_SIZE_MB
        value: "50"
