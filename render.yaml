services:
  # ── ChromaDB Vector Database ──────────────────────────────────────────────
  - type: web
    name: nexus-rag-chroma
    runtime: docker
    dockerCommand: "chromadb run --host 0.0.0.0 --port 8000 --path /chroma/chroma"
    image:
      url: docker.io/chromadb/chroma:0.5.20
    disk:
      name: chroma-data
      mountPath: /chroma/chroma
      sizeGB: 1
    envVars:
      - key: ANONYMIZED_TELEMETRY
        value: "false"
      - key: ALLOW_RESET
        value: "false"

  # ── Node.js Backend ───────────────────────────────────────────────────────
  - type: web
    name: nexus-rag-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    disk:
      name: papers-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CHROMA_URL
        value: "http://nexus-rag-chroma:8000"
      - key: CHROMA_COLLECTION
        value: research_papers
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: EMBEDDING_MODEL
        value: Xenova/all-MiniLM-L6-v2
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "200"
      - key: TOP_K
        value: "5"
      - key: RERANK_TOP_K
        value: "3"
      - key: MAX_FILE_SIZE_MB
        value: "50"
